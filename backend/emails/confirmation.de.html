<!doctype html>
<html lang="de">
  <body style="font-family: Arial, sans-serif; background:#f8fafc; padding:24px;">
    <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px; border:1px solid #e2e8f0;">
      <h1 style="color:#2563eb; font-size:22px;">Danke für deinen Kauf, {{name}}!</h1>
      <p>Deine Bestellung für <strong>{{product}}</strong> ist bestätigt.</p>
      <p>
        <a href="{{downloadLink}}" style="display:inline-block; background:#2563eb; color:#ffffff; padding:12px 20px; border-radius:6px; text-decoration:none; font-weight:bold;">
          Datei herunterladen
        </a>
      </p>
      <p style="color:#64748b; font-size:13px;">Dieser Link läuft aus Sicherheitsgründen in 72 Stunden ab.</p>
      <p>Brauchst du Hilfe? Kontaktiere uns unter <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>.</p>
    </div>
  </body>
</html>
