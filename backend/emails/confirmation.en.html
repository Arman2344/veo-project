<!doctype html>
<html lang="en">
  <body style="font-family: Arial, sans-serif; background:#f8fafc; padding:24px;">
    <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px; border:1px solid #e2e8f0;">
      <h1 style="color:#2563eb; font-size:22px;">Thank you for your purchase, {{name}}!</h1>
      <p>Your order for <strong>{{product}}</strong> is confirmed.</p>
      <p>
        <a href="{{downloadLink}}" style="display:inline-block; background:#2563eb; color:#ffffff; padding:12px 20px; border-radius:6px; text-decoration:none; font-weight:bold;">
          Download your file
        </a>
      </p>
      <p style="color:#64748b; font-size:13px;">This link expires in 72 hours for security reasons.</p>
      <p>Need help? Contact us at <a href="mailto:{{supportEmail}}">{{supportEmail}}</a>.</p>
    </div>
  </body>
</html>
